name: cs611-assignment-2-final

x-airflow-common: &airflow-common
  build: .
  image: cs611-assignment-2-final:local
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__WEBSERVER__SECRET_KEY: cs611-local-assignment
    AIRFLOW__CORE__PARALLELISM: '1'
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: '10'
    MODEL_STORE: /opt/airflow/model_store
    PYTHONDONTWRITEBYTECODE: '1'
    OMP_NUM_THREADS: '2'
    OPENBLAS_NUM_THREADS: '2'
    MPLCONFIGDIR: /tmp/matplotlib
  volumes:
    - airflow_data:/opt/airflow
    - ./dags:/opt/airflow/dags:ro
    - ./:/app

services:
  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-environment
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _AIRFLOW_WWW_USER_FIRSTNAME: Alex
      _AIRFLOW_WWW_USER_LASTNAME: Wang
      _AIRFLOW_WWW_USER_ROLE: Admin
      _AIRFLOW_WWW_USER_EMAIL: admin@example.com
    command: version

  airflow-webserver:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:8080:8080'
    command: webserver
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8080/health']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

volumes:
  airflow_data:
